name: hermes-extensions
version: "0.1.0"
description: Local Hermes extensions for Windows WeChat automation and fleet-wide task management
provides_tools:
  - wechat_status
  - wechat_list_chats
  - wechat_get_unread_chats
  - wechat_get_messages
  - wechat_send_message
  - task_center_overview
  - task_center_upcoming
  - task_center_create
  - task_center_update
  - task_center_action
  - task_center_history
