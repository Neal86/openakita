services:
  openakita:
    build: ../..
    restart: unless-stopped
    expose:
      - "18900"
    volumes:
      - ../../data:/app/data
      - ../../.env:/app/.env:ro
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 18900
      HERMES_CUSTOMER_API_KEY: ${HERMES_CUSTOMER_API_KEY:-}
      HERMES_CONTENT_API_KEY: ${HERMES_CONTENT_API_KEY:-}
    networks: [agents]
    depends_on:
      hermes-customer:
        condition: service_healthy
      hermes-content:
        condition: service_healthy

  hermes-customer:
    image: ${HERMES_IMAGE:-ghcr.io/example/hermes:latest}
    restart: unless-stopped
    expose: ["8000"]
    environment:
      HERMES_ROLE: customer-service
      HERMES_API_KEY: ${HERMES_CUSTOMER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agents]

  hermes-content:
    image: ${HERMES_IMAGE:-ghcr.io/example/hermes:latest}
    restart: unless-stopped
    expose: ["8000"]
    environment:
      HERMES_ROLE: content
      HERMES_API_KEY: ${HERMES_CONTENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agents]

networks:
  agents:
    driver: bridge
