services:
  openakita:
    build: ../..
    restart: unless-stopped
    expose:
      - "18900"
    volumes:
      - ../../data:/app/data
      - ../../.env:/app/.env:ro
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 18900
      HERMES_CUSTOMER_API_KEY: ${HERMES_CUSTOMER_API_KEY:?set HERMES_CUSTOMER_API_KEY}
      HERMES_CONTENT_API_KEY: ${HERMES_CONTENT_API_KEY:?set HERMES_CONTENT_API_KEY}
    networks: [agents]
    depends_on:
      hermes-customer:
        condition: service_healthy
      hermes-content:
        condition: service_healthy

  hermes-customer:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    expose:
      - "8642"
    volumes:
      - hermes_customer_data:/opt/data
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_CUSTOMER_API_KEY:?set HERMES_CUSTOMER_API_KEY}
      API_SERVER_MODEL_NAME: hermes-customer
      HERMES_DASHBOARD: "0"
      HERMES_ALLOW_ROOT_GATEWAY: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks: [agents]

  hermes-content:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    expose:
      - "8642"
    volumes:
      - hermes_content_data:/opt/data
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_CONTENT_API_KEY:?set HERMES_CONTENT_API_KEY}
      API_SERVER_MODEL_NAME: hermes-content
      HERMES_DASHBOARD: "0"
      HERMES_ALLOW_ROOT_GATEWAY: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks: [agents]

networks:
  agents:
    driver: bridge

volumes:
  hermes_customer_data:
  hermes_content_data:
