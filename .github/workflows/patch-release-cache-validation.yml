name: One-shot cached release validation

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-release-cache-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product files
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              (Path('src/openakita/api/routes/windows_connector.py'), 'OPENAKITA_WINDOWS_CONNECTOR_PACKAGE'),
              (Path('src/openakita/api/routes/wechat_desktop.py'), 'OPENAKITA_WECHAT_CONNECTOR_PACKAGE'),
          ]
          for path, env_name in targets:
              text = path.read_text('utf-8')
              old = f'''def _local_release_path() -> Path | None:\n    configured = os.environ.get("{env_name}", "").strip()\n    candidates = [\n        Path(configured).expanduser() if configured else None,\n        _release_cache_path(),\n        Path(__file__).resolve().parents[4] / "dist" / RELEASE_FILENAME,\n    ]\n    return next((path for path in candidates if path and path.is_file()), None)\n'''
              new = f'''def _is_valid_release_zip(path: Path | None) -> bool:\n    if path is None or not path.is_file():\n        return False\n    try:\n        with zipfile.ZipFile(path) as archive:\n            return bool(archive.namelist()) and archive.testzip() is None\n    except (OSError, zipfile.BadZipFile):\n        return False\n\n\ndef _local_release_path() -> Path | None:\n    configured = os.environ.get("{env_name}", "").strip()\n    candidates = [\n        Path(configured).expanduser() if configured else None,\n        _release_cache_path(),\n        Path(__file__).resolve().parents[4] / "dist" / RELEASE_FILENAME,\n    ]\n    return next((path for path in candidates if _is_valid_release_zip(path)), None)\n'''
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'marker changed: {path}')
              path.write_text(text.replace(old, new, 1), 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/routes/windows_connector.py src/openakita/api/routes/wechat_desktop.py
          if git diff --cached --quiet; then
            echo "Already applied."
            exit 0
          fi
          git commit -m "fix: reject stale corrupted Connector cache archives"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
