name: Build WeChat Connector

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "src/openakita/wechat_desktop/connector_bundle/**"
      - ".github/workflows/build-wechat-connector.yml"

permissions:
  contents: read

concurrency:
  group: build-wechat-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/openakita/wechat_desktop/connector_bundle/requirements.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build connector and installer
        shell: powershell
        working-directory: src/openakita/wechat_desktop/connector_bundle
        run: ./build.ps1

      - name: Verify installer exists
        shell: powershell
        working-directory: src/openakita/wechat_desktop/connector_bundle
        run: |
          $installer = "dist/OpenAkita-WeChat-Connector-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not produced" }
          Get-Item $installer | Format-List Name, Length, LastWriteTime

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-WeChat-Connector-Setup
          path: src/openakita/wechat_desktop/connector_bundle/dist/OpenAkita-WeChat-Connector-Setup.exe
          if-no-files-found: error
          retention-days: 30
