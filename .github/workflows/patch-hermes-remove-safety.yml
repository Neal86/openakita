name: One-shot Hermes removal safety

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_hermes_remove_safety.py
      - .github/workflows/patch-hermes-remove-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/patch_hermes_remove_safety.py
      - name: Verify
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/hermes/lifecycle.py tests/hermes/test_remove_safety.py
          pytest -q tests/hermes/test_remove_safety.py tests/hermes
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/hermes/lifecycle.py tests/hermes/test_remove_safety.py
          git commit -m "fix: preserve Docker instance metadata on removal failure"
          git push origin HEAD:feature/hermes-multi-agent
