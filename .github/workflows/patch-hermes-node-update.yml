name: One-shot preserve Hermes node runtime state

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-hermes-node-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/openakita/api/routes/hermes.py')
          text = path.read_text('utf-8')
          old = '''    store = get_hermes_store()\n    if store.get(node_id) is None:\n        raise HTTPException(status_code=404, detail="Hermes node not found")\n    node = HermesNode(**payload.model_dump())\n    store.upsert(node)\n    return {"node": node.to_dict()}\n'''
          new = '''    store = get_hermes_store()\n    existing = store.get(node_id)\n    if existing is None:\n        raise HTTPException(status_code=404, detail="Hermes node not found")\n    data = payload.model_dump()\n    for key, value in data.items():\n        setattr(existing, key, value)\n    # Preserve runtime-owned health/load metadata across an operator edit.\n    existing.__post_init__()\n    store.upsert(existing)\n    return {"node": existing.to_dict()}\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Hermes update marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/routes/hermes.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve Hermes runtime state on node edits"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
