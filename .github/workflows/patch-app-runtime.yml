name: One-shot APP runtime patch

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_hub_runtime_cleanup.py
      - scripts/patch_skill_store_runtime.py
      - .github/workflows/patch-app-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply product patches
        run: |
          python scripts/patch_hub_runtime_cleanup.py
          python scripts/patch_skill_store_runtime.py
      - name: Verify product syntax and diff
        run: |
          python -m compileall -q src/openakita/api/routes/hub.py src/openakita/hub/skill_store_client.py
          git diff --check
      - name: Commit product patches
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/routes/hub.py src/openakita/hub/skill_store_client.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden Hub runtime installation and cleanup"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
