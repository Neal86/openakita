name: One-shot final code repair

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/finalize_runtime_code.py
      - .github/workflows/patch-app-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply final code repairs
        run: python scripts/finalize_runtime_code.py
      - name: Commit product repairs
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/openakita/api/routes/hub.py \
            src/openakita/hub/skill_store_client.py \
            src/openakita/agents/packager.py \
            src/openakita/hermes/native_runtime.py \
            deploy/hermes/shared_gateway.py \
            src/openakita/api/routes/windows_connector.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finalize runtime safety and transaction repairs"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
