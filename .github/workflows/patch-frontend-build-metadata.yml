name: One-shot frontend build metadata

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-frontend-build-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product/build files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock_path = Path('apps/setup-center/package-lock.json')
          data = json.loads(lock_path.read_text('utf-8'))
          package_version = json.loads(Path('apps/setup-center/package.json').read_text('utf-8'))['version']
          data['version'] = package_version
          if isinstance(data.get('packages'), dict) and isinstance(data['packages'].get(''), dict):
              data['packages']['']['version'] = package_version
          lock_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', 'utf-8')

          docker = Path('Dockerfile')
          text = docker.read_text('utf-8')
          text = text.replace('FROM node:20-slim AS frontend', 'FROM node:22-slim AS frontend', 1)
          docker.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product/build fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/setup-center/package-lock.json Dockerfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: align frontend lock metadata and Node runtime"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
