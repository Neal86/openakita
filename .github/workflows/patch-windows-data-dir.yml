name: One-shot Windows data dir fix

on:
  push:
    branches: [feature/hermes-multi-agent]
    paths:
      - scripts/patch_windows_connector_data_dir.py
      - .github/workflows/patch-windows-data-dir.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/patch_windows_connector_data_dir.py
      - name: Verify
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/api/routes/windows_connector.py tests/windows_connector/test_data_dir.py
          pytest -q tests/windows_connector/test_data_dir.py tests/windows_connector
          git diff --check
      - name: Commit
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/routes/windows_connector.py tests/windows_connector/test_data_dir.py
          if git diff --cached --quiet; then
            echo "Windows data-dir fix already applied."
            exit 0
          fi
          git commit -m "fix: align Windows Connector persistent data dir"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
