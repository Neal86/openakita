name: Integrate Hermes execution UI

on:
  push:
    branches: [feature/hermes-multi-agent]
    paths:
      - scripts/integrate_hermes_execution_ui.py
      - scripts/integrate_hermes_agent_cleanup.py
      - .github/workflows/integrate-hermes-ui.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/integrate_hermes_execution_ui.py
      - scripts/integrate_hermes_agent_cleanup.py
      - .github/workflows/integrate-hermes-ui.yml
      - apps/setup-center/src/api/executionInstances.ts
      - apps/setup-center/src/components/ExecutionModeSection.tsx
      - apps/setup-center/src/views/ExecutionInstancesView.tsx
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integrations
        run: |
          python scripts/integrate_hermes_execution_ui.py
          python scripts/integrate_hermes_agent_cleanup.py
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "openakita-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/setup-center/src/App.tsx \
            apps/setup-center/src/types.ts \
            apps/setup-center/src/components/Sidebar.tsx \
            apps/setup-center/src/views/AgentManagerView.tsx \
            src/openakita/api/routes/agents.py
          git commit -m "feat: integrate Hermes execution mode into existing Agent lifecycle"
          git push origin HEAD:feature/hermes-multi-agent
