name: Integrate Hermes execution UI

on:
  workflow_dispatch:

concurrency:
  group: hermes-integration-feature-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integrations
        run: |
          git checkout origin/main -- src/openakita/api/auth.py
          python scripts/integrate_hermes_auth.py
          python scripts/integrate_hermes_execution_ui.py
          python scripts/integrate_hermes_agent_cleanup.py
          python scripts/integrate_hermes_server_routes.py
          python scripts/fix_hermes_ci_failures.py
      - name: Commit generated integration
        run: |
          git config user.name "openakita-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/setup-center/src/App.tsx \
            apps/setup-center/src/types.ts \
            apps/setup-center/src/components/Sidebar.tsx \
            apps/setup-center/src/views/AgentManagerView.tsx \
            src/openakita/api/auth.py \
            src/openakita/api/routes/agents.py \
            src/openakita/api/routes/hermes_ui.py \
            src/openakita/api/routes/llm_gateway.py \
            src/openakita/api/server.py \
            src/openakita/channels/adapters/wechat_desktop.py \
            src/openakita/hermes/bindings.py \
            src/openakita/hermes/client.py \
            src/openakita/hermes/execution.py \
            src/openakita/hermes/hooks.py \
            src/openakita/hermes/models.py \
            src/openakita/wechat_desktop/connector_bundle/pair.py \
            src/openakita/wechat_desktop/manager.py
          if git diff --cached --quiet; then
            echo "Integration is already up to date"
            exit 0
          fi
          git commit -m "chore: refresh generated Hermes integration"
          git push origin HEAD:feature/hermes-multi-agent
