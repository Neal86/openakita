name: One-shot proxy auth hardening patch

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-proxy-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0

      - name: Apply exact proxy-auth edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          auth = Path("src/openakita/api/auth.py")
          text = auth.read_text("utf-8")
          old = """    if not _is_local_request(request):\n        return False\n    trust_proxy = os.environ.get(\"TRUST_PROXY\", \"\").lower() in (\"1\", \"true\", \"yes\")\n    if trust_proxy and request.headers.get(\"x-forwarded-for\"):\n        return False\n    return True\n"""
          new = """    if not _is_local_request(request):\n        return False\n    if request.headers.get(\"x-forwarded-for\") or request.headers.get(\"forwarded\"):\n        return False\n    return True\n"""
          if old not in text:
              raise SystemExit("is_trusted_local pattern changed; refusing broad edit")
          auth.write_text(text.replace(old, new, 1), "utf-8")

          ws = Path("src/openakita/api/routes/websocket.py")
          text = ws.read_text("utf-8")
          old_auth = """def _authenticate_ws(ws: WebSocket, config: WebAccessConfig) -> bool:\n    \"\"\"Authenticate WebSocket connection via query param or local access.\"\"\"\n    # Local connections are exempt — same logic as HTTP middleware:\n    # direct local connections (no X-Forwarded-For) bypass auth even with\n    # trust_proxy; proxy-forwarded ones must provide a valid token.\n    if _is_local_ws(ws):\n        import os\n\n        trust_proxy = os.environ.get(\"TRUST_PROXY\", \"\").lower() in (\"1\", \"true\", \"yes\")\n        if not trust_proxy or not ws.headers.get(\"x-forwarded-for\"):\n            return True\n\n    # Check token from query params\n"""
          new_auth = """def _is_trusted_local_ws(ws: WebSocket) -> bool:\n    \"\"\"Return True only for a direct loopback WebSocket connection.\"\"\"\n    return (\n        _is_local_ws(ws)\n        and not ws.headers.get(\"x-forwarded-for\")\n        and not ws.headers.get(\"forwarded\")\n    )\n\n\ndef _authenticate_ws(ws: WebSocket, config: WebAccessConfig) -> bool:\n    \"\"\"Authenticate WebSocket connection via query param or direct local access.\"\"\"\n    if _is_trusted_local_ws(ws):\n        return True\n\n    # Check token from query params\n"""
          if old_auth not in text:
              raise SystemExit("websocket auth pattern changed; refusing broad edit")
          text = text.replace(old_auth, new_auth, 1)
          old_mark = "    is_local = _is_local_ws(ws)\n    await manager.connect(ws, is_local=is_local)"
          new_mark = "    is_local = _is_trusted_local_ws(ws)\n    await manager.connect(ws, is_local=is_local)"
          if old_mark not in text:
              raise SystemExit("websocket local marker pattern changed; refusing broad edit")
          ws.write_text(text.replace(old_mark, new_mark, 1), "utf-8")

          test = Path("tests/api/test_proxy_local_auth.py")
          test.write_text("\n".join([
              "from starlette.requests import Request",
              "from starlette.websockets import WebSocket",
              "",
              "from openakita.api.auth import is_trusted_local",
              "from openakita.api.routes.websocket import _is_trusted_local_ws",
              "",
              "",
              "def _request(headers=None):",
              "    return Request({\"type\": \"http\", \"method\": \"GET\", \"path\": \"/api/health\", \"headers\": headers or [], \"client\": (\"127.0.0.1\", 1234), \"server\": (\"localhost\", 18900), \"scheme\": \"http\", \"query_string\": b\"\"})",
              "",
              "",
              "def _ws(headers=None):",
              "    return WebSocket({\"type\": \"websocket\", \"path\": \"/ws/events\", \"headers\": headers or [], \"client\": (\"127.0.0.1\", 1234), \"server\": (\"localhost\", 18900), \"scheme\": \"ws\", \"query_string\": b\"\", \"subprotocols\": []}, receive=lambda: None, send=lambda message: None)",
              "",
              "",
              "def test_forwarded_loopback_http_is_not_trusted_local():",
              "    assert is_trusted_local(_request())",
              "    assert not is_trusted_local(_request([(b\"x-forwarded-for\", b\"203.0.113.10\")]))",
              "    assert not is_trusted_local(_request([(b\"forwarded\", b\"for=203.0.113.10\")]))",
              "",
              "",
              "def test_forwarded_loopback_websocket_is_not_trusted_local():",
              "    assert _is_trusted_local_ws(_ws())",
              "    assert not _is_trusted_local_ws(_ws([(b\"x-forwarded-for\", b\"203.0.113.10\")]))",
              "    assert not _is_trusted_local_ws(_ws([(b\"forwarded\", b\"for=203.0.113.10\")]))",
              "",
          ]), "utf-8")
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/openakita/api/auth.py src/openakita/api/routes/websocket.py tests/api/test_proxy_local_auth.py
          git diff --check
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/auth.py src/openakita/api/routes/websocket.py tests/api/test_proxy_local_auth.py
          git commit -m "fix: prevent proxied loopback auth bypass"
          git push origin HEAD:feature/hermes-multi-agent
