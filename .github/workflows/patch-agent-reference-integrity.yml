name: One-shot Agent reference integrity patch

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-agent-reference-integrity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0

      - name: Apply exact reference-integrity edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Authoritative profile resolver: store/ephemeral + system presets.
          path = Path("src/openakita/agents/profile.py")
          text = path.read_text("utf-8")
          marker = "        _global_store = ProfileStore(base_dir)\n        return _global_store\n\n\nclass ProfileStore:"
          replacement = """        _global_store = ProfileStore(base_dir)
        return _global_store


def resolve_agent_profile(profile_id: str) -> AgentProfile | None:
    \"\"\"Resolve a persisted/ephemeral profile or an undeployed system preset.\"\"\"
    profile = get_profile_store().get(profile_id)
    if profile is not None:
        return profile
    from openakita.agents.presets import get_preset_by_id

    return get_preset_by_id(profile_id)


def agent_profile_exists(profile_id: str) -> bool:
    return resolve_agent_profile(profile_id) is not None


class ProfileStore:"""
          if marker not in text:
              raise SystemExit("profile resolver insertion point changed")
          path.write_text(text.replace(marker, replacement, 1), "utf-8")

          # 2) Execution API uses authoritative resolver.
          path = Path("src/openakita/api/routes/execution_instances.py")
          text = path.read_text("utf-8")
          old = """    from openakita.agents.profile import get_profile_store

    if not get_profile_store().exists(profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
"""
          new = """    from openakita.agents.profile import agent_profile_exists

    if not agent_profile_exists(profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
"""
          if old not in text:
              raise SystemExit("execution profile validation pattern changed")
          path.write_text(text.replace(old, new, 1), "utf-8")

          # 3) Hermes binding API uses the same resolver.
          path = Path("src/openakita/api/routes/hermes.py")
          text = path.read_text("utf-8")
          old = """def _require_agent_profile(profile_id: str) -> None:
    from openakita.agents.profile import get_profile_store

    if not get_profile_store().exists(profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
"""
          new = """def _require_agent_profile(profile_id: str) -> None:
    from openakita.agents.profile import agent_profile_exists

    if not agent_profile_exists(profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
"""
          if old not in text:
              raise SystemExit("Hermes profile validation pattern changed")
          path.write_text(text.replace(old, new, 1), "utf-8")

          # 4) Windows grants/execute reject ghost Agents.
          path = Path("src/openakita/api/routes/windows_connector.py")
          text = path.read_text("utf-8")
          old = """@router.post(\"/grants\")
async def save_grant(body: GrantPayload) -> dict[str, Any]:
    try:
        grant = await windows_connector_manager.upsert_grant(body.model_dump())
"""
          new = """@router.post(\"/grants\")
async def save_grant(body: GrantPayload) -> dict[str, Any]:
    from openakita.agents.profile import agent_profile_exists

    if not agent_profile_exists(body.agent_profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
    try:
        grant = await windows_connector_manager.upsert_grant(body.model_dump())
"""
          if old not in text:
              raise SystemExit("Windows grant pattern changed")
          text = text.replace(old, new, 1)
          old = """@router.post(\"/execute\")
async def execute(body: ExecutePayload) -> dict[str, Any]:
    try:
        return await windows_connector_manager.execute(
"""
          new = """@router.post(\"/execute\")
async def execute(body: ExecutePayload) -> dict[str, Any]:
    from openakita.agents.profile import agent_profile_exists

    if not agent_profile_exists(body.agent_profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")
    try:
        return await windows_connector_manager.execute(
"""
          if old not in text:
              raise SystemExit("Windows execute pattern changed")
          path.write_text(text.replace(old, new, 1), "utf-8")

          # 5) LLM gateway resolves undeployed system presets too.
          path = Path("src/openakita/api/routes/llm_gateway.py")
          text = path.read_text("utf-8")
          old = """    try:
        from openakita.agents.profile import get_profile_store

        return get_profile_store().get(profile_id)
    except Exception:
        return None
"""
          new = """    try:
        from openakita.agents.profile import resolve_agent_profile

        return resolve_agent_profile(profile_id)
    except Exception:
        return None
"""
          if old not in text:
              raise SystemExit("Gateway profile fallback pattern changed")
          path.write_text(text.replace(old, new, 1), "utf-8")

          # 6) Bot references + profile deletion cleanup.
          path = Path("src/openakita/api/routes/agents.py")
          text = path.read_text("utf-8")
          old = """    if not isinstance(body.credentials, dict):
        raise HTTPException(status_code=400, detail=\"credentials must be a dict\")

    existing_ids = {b.get(\"id\") for b in settings.im_bots if isinstance(b, dict)}
"""
          new = """    if not isinstance(body.credentials, dict):
        raise HTTPException(status_code=400, detail=\"credentials must be a dict\")
    from openakita.agents.profile import agent_profile_exists

    if not agent_profile_exists(body.agent_profile_id):
        raise HTTPException(status_code=404, detail=\"Agent profile not found\")

    existing_ids = {b.get(\"id\") for b in settings.im_bots if isinstance(b, dict)}
"""
          if old not in text:
              raise SystemExit("Bot create validation pattern changed")
          text = text.replace(old, new, 1)

          old = """    if body.agent_profile_id is not None:
        bot[\"agent_profile_id\"] = body.agent_profile_id
"""
          new = """    if body.agent_profile_id is not None:
        from openakita.agents.profile import agent_profile_exists

        if not agent_profile_exists(body.agent_profile_id):
            raise HTTPException(status_code=404, detail=\"Agent profile not found\")
        bot[\"agent_profile_id\"] = body.agent_profile_id
"""
          if old not in text:
              raise SystemExit("Bot update validation pattern changed")
          text = text.replace(old, new, 1)

          old = """    store = get_profile_store()

    try:
        deleted = store.delete(profile_id)
"""
          new = """    store = get_profile_store()

    from openakita.config import settings

    referencing_bots = [
        str(bot.get(\"id\") or \"\")
        for bot in settings.im_bots
        if isinstance(bot, dict) and str(bot.get(\"agent_profile_id\") or \"default\") == profile_id
    ]
    if referencing_bots:
        raise HTTPException(
            status_code=409,
            detail=\"Agent is still used by bots: \" + \", \".join(sorted(referencing_bots)),
        )

    try:
        deleted = store.delete(profile_id)
"""
          if old not in text:
              raise SystemExit("Profile delete preflight pattern changed")
          text = text.replace(old, new, 1)

          old = """    finally:
        execution_store.delete(profile_id)
        binding_store.delete(profile_id)

    logger.info(f\"[Agents API] Deleted profile: {profile_id}\")
"""
          new = """    finally:
        execution_store.delete(profile_id)
        binding_store.delete(profile_id)

    from openakita.windows_connector import windows_connector_manager

    for grant in await windows_connector_manager.list_grants():
        if str(grant.get(\"agent_profile_id\") or \"\") != profile_id:
            continue
        grant_id = str(grant.get(\"id\") or \"\")
        if not grant_id:
            continue
        try:
            await windows_connector_manager.delete_grant(grant_id)
        except Exception as exc:
            logger.warning(
                \"[Agents API] Windows grant cleanup failed for %s/%s: %s\",
                profile_id,
                grant_id,
                exc,
            )

    logger.info(f\"[Agents API] Deleted profile: {profile_id}\")
"""
          if old not in text:
              raise SystemExit("Profile delete cleanup pattern changed")
          path.write_text(text.replace(old, new, 1), "utf-8")

          # Tests: undeployed preset is valid and a missing profile is not.
          test = Path("tests/agent/test_profile_reference_integrity.py")
          test.write_text("\n".join([
              "from pathlib import Path",
              "",
              "from openakita.agents import profile as profile_module",
              "from openakita.agents.profile import ProfileStore",
              "",
              "",
              "def test_system_preset_is_resolved_even_when_not_persisted(tmp_path: Path, monkeypatch):",
              "    store = ProfileStore(tmp_path / \"agents\")",
              "    monkeypatch.setattr(profile_module, \"_global_store\", store)",
              "    assert not store.exists(\"default\")",
              "    resolved = profile_module.resolve_agent_profile(\"default\")",
              "    assert resolved is not None",
              "    assert resolved.id == \"default\"",
              "    assert profile_module.agent_profile_exists(\"default\")",
              "    assert not profile_module.agent_profile_exists(\"definitely-missing-agent\")",
              "",
          ]), "utf-8")
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/openakita/agents/profile.py src/openakita/api/routes/agents.py src/openakita/api/routes/execution_instances.py src/openakita/api/routes/hermes.py src/openakita/api/routes/windows_connector.py src/openakita/api/routes/llm_gateway.py tests/agent/test_profile_reference_integrity.py
          git diff --check
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/agents/profile.py src/openakita/api/routes/agents.py src/openakita/api/routes/execution_instances.py src/openakita/api/routes/hermes.py src/openakita/api/routes/windows_connector.py src/openakita/api/routes/llm_gateway.py tests/agent/test_profile_reference_integrity.py
          git commit -m "fix: enforce Agent reference integrity"
          git push origin HEAD:feature/hermes-multi-agent
