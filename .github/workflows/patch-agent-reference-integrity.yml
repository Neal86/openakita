name: One-shot Agent reference integrity patch

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-agent-reference-integrity.yml
      - scripts/patch_agent_reference_integrity.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0

      - name: Apply exact reference-integrity edits
        run: python scripts/patch_agent_reference_integrity.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/openakita/agents/profile.py \
            src/openakita/api/routes/agents.py \
            src/openakita/api/routes/execution_instances.py \
            src/openakita/api/routes/hermes.py \
            src/openakita/api/routes/windows_connector.py \
            src/openakita/api/routes/llm_gateway.py \
            tests/agent/test_profile_reference_integrity.py
          git diff --check
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/openakita/agents/profile.py \
            src/openakita/api/routes/agents.py \
            src/openakita/api/routes/execution_instances.py \
            src/openakita/api/routes/hermes.py \
            src/openakita/api/routes/windows_connector.py \
            src/openakita/api/routes/llm_gateway.py \
            tests/agent/test_profile_reference_integrity.py
          git commit -m "fix: enforce Agent reference integrity"
          git push origin HEAD:feature/hermes-multi-agent
