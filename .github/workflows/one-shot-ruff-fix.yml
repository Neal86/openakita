name: One-shot Ruff Fix

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/one-shot-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.2
      - name: Apply scoped Ruff fixes
        run: ruff check src/ --fix
      - name: Remove one-shot workflow and commit fixes
        run: |
          rm -f .github/workflows/one-shot-ruff-fix.yml
          git config user.name "openakita-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/ .github/workflows/one-shot-ruff-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(lint): apply scoped Ruff fixes [skip ci]"
          git push origin HEAD:feature/hermes-multi-agent
