name: Hermes Extensions release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-extensions
    tags:
      - "hermes-extensions-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          from pathlib import Path
          for line in Path('hermes-extensions/plugin.yaml').read_text('utf-8').splitlines():
              if line.startswith('version:'):
                  print(line.partition(':')[2].strip().strip('"').strip("'"))
                  break
          PY
          )
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate and build source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hermes-extensions/requirements.txt pytest ruff fastapi pydantic
          python -m compileall -q hermes-extensions
          ruff check hermes-extensions
          for file in hermes-extensions/dashboard/src/api.js hermes-extensions/dashboard/src/components.js hermes-extensions/dashboard/src/app.js hermes-extensions/dashboard/src/index.js; do node --check "$file"; done
          python hermes-extensions/dashboard/build_bundle.py
          node --check hermes-extensions/dashboard/dist/index.js
          pytest -q hermes-extensions/tests

      - name: Build isolated release tree
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT="release/hermes-extensions-v${VERSION}"
          mkdir -p "$OUT"
          rsync -a hermes-extensions/ "$OUT/" \
            --exclude tests \
            --exclude __pycache__ \
            --exclude .pytest_cache
          python - <<PY
          import json
          from pathlib import Path
          root = Path('$OUT')
          manifest = json.loads((root/'dashboard/manifest.json').read_text('utf-8'))
          assert manifest['entry'] == 'dist/index.js'
          assert manifest['api'] == 'plugin_api.py'
          assert manifest['icon'] == 'Activity'
          for rel in [
              'plugin.yaml', '__init__.py', 'install.ps1', 'doctor.ps1',
              'compatibility.py', 'dashboard/manifest.json', 'dashboard/build_bundle.py',
              'dashboard/src/api.js', 'dashboard/src/components.js', 'dashboard/src/app.js', 'dashboard/src/index.js',
              'dashboard/dist/index.js', 'dashboard/dist/style.css', 'dashboard/plugin_api.py',
              'management/overview.py', 'task_center/service_v3.py', 'wechat/adapter.py',
              'wechat/runtime.py', 'platforms/wechat-desktop/plugin.yaml'
          ]:
              assert (root/rel).is_file(), rel
          ui = (root/'dashboard/dist/index.js').read_text('utf-8')
          assert 'Discard unsaved changes?' in ui
          assert 'Opening this tab does not touch the desktop app' in ui
          assert 'ConfirmDialog' in ui
          PY
          (cd release && zip -qr "hermes-extensions-v${VERSION}.zip" "hermes-extensions-v${VERSION}")
          cd release
          sha256sum "hermes-extensions-v${VERSION}.zip" > "hermes-extensions-v${VERSION}.zip.sha256"

      - name: Validate release archive isolation
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          unzip -l "release/hermes-extensions-v${VERSION}.zip" > /tmp/archive.txt
          ! grep -q "src/openakita" /tmp/archive.txt
          ! grep -q "apps/setup-center" /tmp/archive.txt
          ! grep -q "/tests/" /tmp/archive.txt
          grep -q "hermes-extensions-v${VERSION}/dashboard/dist/index.js" /tmp/archive.txt
          grep -q "hermes-extensions-v${VERSION}/dashboard/build_bundle.py" /tmp/archive.txt
          grep -q "hermes-extensions-v${VERSION}/dashboard/src/app.js" /tmp/archive.txt
          grep -q "hermes-extensions-v${VERSION}/wechat/runtime.py" /tmp/archive.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-extensions-v${{ steps.version.outputs.version }}
          path: |
            release/hermes-extensions-v${{ steps.version.outputs.version }}.zip
            release/hermes-extensions-v${{ steps.version.outputs.version }}.zip.sha256

      - name: Publish GitHub Release for tag builds
        if: startsWith(github.ref, 'refs/tags/hermes-extensions-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="hermes-extensions-v${VERSION}"
          test "$GITHUB_REF_NAME" = "$TAG"
          gh release create "$TAG" \
            "release/hermes-extensions-v${VERSION}.zip" \
            "release/hermes-extensions-v${VERSION}.zip.sha256" \
            --title "Hermes Extensions v${VERSION}" \
            --notes "Hermes Extensions v${VERSION} polishes the complete Management Center UX with a modular single-bundle frontend, context-aware and visibility-aware refresh, health-only WeChat tab loading, explicit partial desktop checks, focus-trapped dialogs, focus restore, consistent confirmation dialogs, unsaved-change protection, granular action states, and touch-friendly mobile controls. Runtime safety and Hermes v0.16 compatibility are retained."
