name: One-shot safety hardening

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_connector_generation.py
      - scripts/patch_wechat_release_zip.py
      - scripts/patch_agent_data_delete_safety.py
      - scripts/patch_profile_store_delete_safety.py
      - .github/workflows/patch-connector-generation.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply product safety patches
        run: |
          python scripts/patch_connector_generation.py
          python scripts/patch_wechat_release_zip.py
          python scripts/patch_agent_data_delete_safety.py
          python scripts/patch_profile_store_delete_safety.py
          git diff --check
      - name: Commit product fixes
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/wechat_desktop/manager.py src/openakita/windows_connector/manager.py src/openakita/api/routes/wechat_desktop.py src/openakita/api/routes/agents.py src/openakita/agents/profile.py
          if git diff --cached --quiet; then
            echo "Product fixes already applied."
            exit 0
          fi
          git commit -m "fix: harden connector sessions and Agent data deletion"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
