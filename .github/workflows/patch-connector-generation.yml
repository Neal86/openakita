name: One-shot safety hardening

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_connector_generation.py
      - scripts/patch_wechat_release_zip.py
      - scripts/patch_agent_data_delete_safety.py
      - scripts/patch_profile_store_delete_safety.py
      - scripts/patch_profile_store_consistency.py
      - scripts/patch_agent_package_safety.py
      - .github/workflows/patch-connector-generation.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply safety patches
        run: |
          python scripts/patch_connector_generation.py
          python scripts/patch_wechat_release_zip.py
          python scripts/patch_agent_data_delete_safety.py
          python scripts/patch_profile_store_delete_safety.py
          python scripts/patch_profile_store_consistency.py
          python scripts/patch_agent_package_safety.py
      - name: Verify safety hardening
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/wechat_desktop/manager.py src/openakita/windows_connector/manager.py src/openakita/api/routes/wechat_desktop.py src/openakita/api/routes/agents.py src/openakita/api/routes/hub.py src/openakita/agents/profile.py src/openakita/agents/manifest.py src/openakita/agents/packager.py src/openakita/hermes/paths.py tests/wechat_desktop/test_connection_generation.py tests/wechat_desktop/test_release_download.py tests/api/test_agent_data_delete_safety.py tests/api/test_profile_store_delete_safety.py tests/api/test_profile_store_consistency.py tests/api/test_agent_package_safety.py tests/hermes/test_paths.py
          pytest -q tests/wechat_desktop/test_connection_generation.py tests/wechat_desktop/test_release_download.py tests/api/test_agent_data_delete_safety.py tests/api/test_profile_store_delete_safety.py tests/api/test_profile_store_consistency.py tests/api/test_agent_package_safety.py tests/windows_connector tests/wechat_desktop tests/hermes
          git diff --check
      - name: Commit safety hardening
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/wechat_desktop/manager.py src/openakita/windows_connector/manager.py src/openakita/api/routes/wechat_desktop.py src/openakita/api/routes/agents.py src/openakita/api/routes/hub.py src/openakita/agents/profile.py src/openakita/agents/manifest.py src/openakita/agents/packager.py tests/wechat_desktop/test_connection_generation.py tests/wechat_desktop/test_release_download.py tests/api/test_agent_data_delete_safety.py tests/api/test_profile_store_delete_safety.py tests/api/test_profile_store_consistency.py tests/api/test_agent_package_safety.py
          if git diff --cached --quiet; then
            echo "Safety hardening already applied."
            exit 0
          fi
          git commit -m "fix: harden connector sessions and Agent data safety"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
