name: One-shot static cleanup

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_packager_cleanup.py
      - .github/workflows/patch-connector-generation.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply packager cleanup
        run: python scripts/patch_packager_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/agents/packager.py
          if git diff --cached --quiet; then
            echo "Packager cleanup already applied."
            exit 0
          fi
          git commit -m "fix: clean Agent packager static-review regressions"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
