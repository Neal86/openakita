name: One-shot maintenance patch

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/maintenance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0

      - name: Apply exact maintenance edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changed = []

          spec = Path("build/openakita.spec")
          text = spec.read_text("utf-8")
          new = text.replace('    "openakita.core.llm",\n', "")
          new = new.replace('    "openakita.core.tools",\n', "")
          if new != text:
              spec.write_text(new, "utf-8")
              changed.append(str(spec))

          bootstrap = Path("build/prepare_bootstrap_resources.py")
          text = bootstrap.read_text("utf-8")
          old = '''            with urllib.request.urlopen(url, timeout=90) as resp, tmp.open("wb") as fh:\n                shutil.copyfileobj(resp, fh)'''
          hardened = '''            request = urllib.request.Request(\n                url,\n                headers={\n                    "User-Agent": "OpenAkita-Bootstrap/1.0",\n                    "Accept": "application/octet-stream",\n                },\n            )\n            with urllib.request.urlopen(request, timeout=90) as resp, tmp.open("wb") as fh:\n                shutil.copyfileobj(resp, fh)'''
          text2 = text
          if old in text2:
              text2 = text2.replace(old, hardened, 1)
          elif hardened not in text2:
              raise SystemExit("bootstrap download_with_retries pattern changed; refusing broad edit")

          old_head = '        req = urllib.request.Request(url, method="HEAD")'
          hardened_head = '''        req = urllib.request.Request(\n            url,\n            method="HEAD",\n            headers={"User-Agent": "OpenAkita-Bootstrap/1.0"},\n        )'''
          if old_head in text2:
              text2 = text2.replace(old_head, hardened_head, 1)
          elif hardened_head not in text2:
              raise SystemExit("bootstrap head_check pattern changed; refusing broad edit")
          if text2 != text:
              bootstrap.write_text(text2, "utf-8")
              changed.append(str(bootstrap))

          execution = Path("src/openakita/api/routes/execution_instances.py")
          text = execution.read_text("utf-8")
          marker = '''async def set_agent_execution(profile_id: str, payload: ExecutionPayload) -> dict:\n    config = AgentExecutionConfig(profile_id=profile_id, **payload.model_dump())'''
          replacement = '''async def set_agent_execution(profile_id: str, payload: ExecutionPayload) -> dict:\n    from openakita.agents.profile import get_profile_store\n\n    if not get_profile_store().exists(profile_id):\n        raise HTTPException(status_code=404, detail="Agent profile not found")\n    config = AgentExecutionConfig(profile_id=profile_id, **payload.model_dump())'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
              execution.write_text(text, "utf-8")
              changed.append(str(execution))
          elif replacement not in text:
              raise SystemExit("execution set_agent_execution pattern changed; refusing broad edit")

          print("Changed files:")
          for rel in changed:
              print(" -", rel)
          if not changed:
              print("No maintenance edits were needed")
          PY

      - name: Commit exact edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/routes/execution_instances.py
          git add -f build/openakita.spec build/prepare_bootstrap_resources.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: harden bootstrap packaging and execution API"
          git push origin HEAD:feature/hermes-multi-agent
