name: One-shot server-side WeChat binding

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-wechat-server-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/openakita/wechat_desktop/manager.py')
          text = path.read_text('utf-8')
          old = '''    async def dispatch_inbound(self, bot_id: str, payload: dict[str, Any]) -> None:\n        async with self._lock:\n            callback = self._callbacks.get(bot_id)\n        if callback is None:\n            raise ValueError(f"wechat desktop bot is not running: {bot_id}")\n        await callback(payload)\n'''
          new = '''    async def dispatch_inbound(\n        self, node_id: str, bot_id: str, payload: dict[str, Any]\n    ) -> None:\n        account_id = str(payload.get("wechat_account_id") or "").strip()\n        if not account_id:\n            raise ValueError("wechat_account_id is required")\n        async with self._lock:\n            bound_bot = self._bindings.get((node_id, account_id))\n            callback = self._callbacks.get(bot_id) if bound_bot == bot_id else None\n        if bound_bot != bot_id:\n            raise PermissionError(\n                "connector message does not match the server-side WeChat Bot binding"\n            )\n        if callback is None:\n            raise ValueError(f"wechat desktop bot is not running: {bot_id}")\n        await callback(payload)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('dispatch binding marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')

          path = Path('src/openakita/api/routes/wechat_desktop.py')
          text = path.read_text('utf-8')
          old = '''                    await wechat_desktop_manager.dispatch_inbound(bot_id, payload)\n'''
          new = '''                    await wechat_desktop_manager.dispatch_inbound(\n                        node_id, bot_id, payload\n                    )\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('dispatch route marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/wechat_desktop/manager.py src/openakita/api/routes/wechat_desktop.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: enforce server-side WeChat Bot bindings"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
