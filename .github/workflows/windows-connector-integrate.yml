name: Windows Connector integration

on:
  workflow_dispatch:
  push:
    branches: [feature/hermes-multi-agent]
    paths:
      - ".github/workflows/windows-connector-integrate.yml"
      - "src/openakita/windows_connector/**"
      - "src/openakita/api/auth.py"
      - "src/openakita/api/routes/windows_connector.py"
      - "src/openakita/api/routes/wechat_desktop.py"
      - "src/openakita/api/routes/execution_instances.py"
      - "src/openakita/api/routes/llm_gateway.py"
      - "src/openakita/hermes/**"
      - "src/openakita/wechat_desktop/connector_bundle/**"
      - "apps/setup-center/src/components/WindowsConnectorPanel.tsx"
      - "apps/setup-center/src/views/ExecutionInstancesView.tsx"
      - "tests/windows_connector/**"
      - "tests/wechat_desktop/**"
      - "tests/hermes/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile Windows Connector and Hermes modules
        run: |
          python -m compileall -q \
            src/openakita/windows_connector \
            src/openakita/api/auth.py \
            src/openakita/api/routes/windows_connector.py \
            src/openakita/api/routes/execution_instances.py \
            src/openakita/api/routes/wechat_desktop.py \
            src/openakita/api/routes/llm_gateway.py \
            src/openakita/hermes \
            src/openakita/wechat_desktop/connector_bundle

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk

      - name: Ruff Windows Connector and Hermes changes
        run: |
          ruff check \
            src/openakita/windows_connector \
            src/openakita/api/auth.py \
            src/openakita/api/routes/windows_connector.py \
            src/openakita/api/routes/execution_instances.py \
            src/openakita/api/routes/wechat_desktop.py \
            src/openakita/api/routes/llm_gateway.py \
            src/openakita/hermes \
            tests/windows_connector \
            tests/wechat_desktop \
            tests/hermes

      - name: Windows Connector and Hermes regression tests
        run: pytest -q tests/windows_connector tests/wechat_desktop tests/hermes

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/setup-center/package-lock.json

      - name: Build Setup Center
        working-directory: apps/setup-center
        run: |
          npm ci
          npm run build

      - name: Verify Connector release contract
        run: |
          grep -F 'OpenAkita-Windows-Connector-Windows-x64' .github/workflows/wechat-connector-release.yml
          grep -F 'windows-connector-latest' .github/workflows/wechat-connector-release.yml

      - name: Ensure CI did not mutate tracked source
        run: git diff --exit-code
