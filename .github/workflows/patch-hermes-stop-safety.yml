name: One-shot Hermes stop safety

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-hermes-stop-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/openakita/hermes/lifecycle.py')
          text = path.read_text('utf-8')
          old = '''        else:\n            if instance.mode == HermesInstanceMode.SHARED:\n                raise ContainerManagerError("共享容器实例不能在这里停止")\n            updated = await self.containers.stop(instance) if HermesContainerManager.available() else replace(instance, lifecycle_status=InstanceLifecycle.STOPPED)\n        self.instances.upsert(updated)\n'''
          new = '''        else:\n            if instance.mode == HermesInstanceMode.SHARED:\n                raise ContainerManagerError("共享容器实例不能在这里停止")\n            if not HermesContainerManager.available():\n                raise ContainerManagerError(\n                    "Docker socket unavailable; cannot verify or stop Hermes container"\n                )\n            updated = await self.containers.stop(instance)\n        self.instances.upsert(updated)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Hermes stop marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/hermes/lifecycle.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: never report Docker Hermes stopped without Docker access"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
