name: One-shot WeChat chat authorization

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-wechat-chat-authorization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/openakita/wechat_desktop/connector_bundle/connector.py')
          text = path.read_text('utf-8')
          old = '''                                    if (\n                                        str(cfg.get("wechat_account_id") or "")\n                                        != message_payload["wechat_account_id"]\n                                    ):\n                                        continue\n                                    await socket.send(\n'''
          new = '''                                    if (\n                                        str(cfg.get("wechat_account_id") or "")\n                                        != message_payload["wechat_account_id"]\n                                    ):\n                                        continue\n                                    allowed_chats = {\n                                        str(value)\n                                        for value in (\n                                            list(cfg.get("allowed_groups") or [])\n                                            + list(cfg.get("allowed_contacts") or [])\n                                        )\n                                        if str(value)\n                                    }\n                                    if str(message_payload.get("chat_id") or "") not in allowed_chats:\n                                        continue\n                                    await socket.send(\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('inbound authorization marker changed')
              text = text.replace(old, new, 1)

          old = '''                            elif event == "wechat.message.send":\n                                request_id = str(envelope.get("request_id") or "")\n                                await socket.send(\n'''
          new = '''                            elif event == "wechat.message.send":\n                                request_id = str(envelope.get("request_id") or "")\n                                if bot_id not in bot_configs:\n                                    await socket.send(\n                                        json.dumps(\n                                            {\n                                                "event": "wechat.message.failed",\n                                                "request_id": request_id,\n                                                "bot_id": bot_id,\n                                                "payload": {"detail": "Bot configuration is no longer active"},\n                                            },\n                                            ensure_ascii=False,\n                                        )\n                                    )\n                                    continue\n                                await socket.send(\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('outbound authorization marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/wechat_desktop/connector_bundle/connector.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: enforce current WeChat chat authorization"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
