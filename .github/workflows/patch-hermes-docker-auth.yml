name: One-shot Docker Hermes gateway auth

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-hermes-docker-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product files
        run: |
          python - <<'PY'
          from pathlib import Path

          # Dynamic dedicated containers receive the actual per-install secret.
          path = Path('src/openakita/hermes/container_manager.py')
          text = path.read_text('utf-8')
          old = '''from .execution import HermesInstance, InstanceLifecycle\n'''
          new = '''from .execution import HermesInstance, InstanceLifecycle\nfrom .internal_auth import internal_gateway_secret\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('container import marker changed')
              text = text.replace(old, new, 1)
          old = '''            "-e", "OPENAI_API_KEY=openakita-internal",\n'''
          new = '''            "-e", f"OPENAI_API_KEY={internal_gateway_secret()}",\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('container API key marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')

          # Shared gateway resolves the same token lazily from a shared auth file.
          path = Path('deploy/hermes/shared_gateway.py')
          text = path.read_text('utf-8')
          marker = '''MAX_CHILDREN = int(os.environ.get("HERMES_SHARED_MAX_AGENTS", "32"))\n\n\n'''
          addition = '''MAX_CHILDREN = int(os.environ.get("HERMES_SHARED_MAX_AGENTS", "32"))\nAUTH_FILE = os.environ.get("OPENAKITA_HERMES_AUTH_FILE", "").strip()\n\n\ndef openakita_gateway_key() -> str:\n    configured = os.environ.get("OPENAKITA_HERMES_LLM_API_KEY", "").strip()\n    if configured:\n        return configured\n    if AUTH_FILE:\n        try:\n            value = Path(AUTH_FILE).read_text("utf-8").strip()\n        except OSError:\n            value = ""\n        if value:\n            return value\n    raise HTTPException(\n        status_code=503,\n        detail="OpenAkita internal gateway token is not available yet",\n    )\n\n\n'''
          if 'def openakita_gateway_key()' not in text:
              if marker not in text:
                  raise SystemExit('shared gateway auth marker changed')
              text = text.replace(marker, addition, 1)
          old = '''                "OPENAI_API_KEY": env.get("OPENAI_API_KEY", "openakita-internal"),\n'''
          new = '''                "OPENAI_API_KEY": openakita_gateway_key(),\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('shared child key marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')

          # Compose shares only the auth token volume; Hermes mounts it read-only.
          path = Path('docker-compose.yml')
          text = path.read_text('utf-8')
          old = '''      - /var/run/docker.sock:/var/run/docker.sock\n    environment:\n      API_HOST: 0.0.0.0\n      API_PORT: 18900\n'''
          new = '''      - /var/run/docker.sock:/var/run/docker.sock\n      - hermes_auth_data:/run/openakita-hermes-auth\n    environment:\n      API_HOST: 0.0.0.0\n      API_PORT: 18900\n      OPENAKITA_HERMES_AUTH_FILE: /run/openakita-hermes-auth/internal_gateway_token\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('openakita compose auth marker changed')
              text = text.replace(old, new, 1)
          old = '''    volumes:\n      - hermes_shared_data:/opt/data\n    environment:\n'''
          new = '''    volumes:\n      - hermes_shared_data:/opt/data\n      - hermes_auth_data:/run/openakita-hermes-auth:ro\n    environment:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('shared compose volume marker changed')
              text = text.replace(old, new, 1)
          old = '''      HERMES_SHARED_MAX_AGENTS: 32\n      OPENAI_API_KEY: openakita-internal\n      OPENAI_BASE_URL: http://openakita:18900/v1\n'''
          new = '''      HERMES_SHARED_MAX_AGENTS: 32\n      OPENAKITA_HERMES_AUTH_FILE: /run/openakita-hermes-auth/internal_gateway_token\n      OPENAI_BASE_URL: http://openakita:18900/v1\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('shared compose env marker changed')
              text = text.replace(old, new, 1)
          old = '''  hermes_shared_data:\n    name: openakita_hermes_shared_data\n    external: true\n'''
          new = '''  hermes_shared_data:\n    name: openakita_hermes_shared_data\n    external: true\n  hermes_auth_data:\n    name: openakita_hermes_auth_data\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('compose auth volume marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/hermes/container_manager.py deploy/hermes/shared_gateway.py docker-compose.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: synchronize Docker Hermes gateway secret"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
