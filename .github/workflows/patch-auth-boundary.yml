name: One-shot auth boundary hardening

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_auth_boundary.py
      - .github/workflows/patch-auth-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/patch_auth_boundary.py
      - name: Verify
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/api/auth.py tests/api/test_auth_exemption_boundaries.py tests/api/test_web_access_persistence.py
          pytest -q tests/api/test_auth_exemption_boundaries.py tests/api/test_web_access_persistence.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/auth.py tests/api/test_auth_exemption_boundaries.py
          git commit -m "fix: enforce auth exemption path boundaries"
          git push origin HEAD:feature/hermes-multi-agent
