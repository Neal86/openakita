name: One-shot web access persistence hardening

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_web_access_persistence.py
      - scripts/patch_web_access_live_reload.py
      - .github/workflows/patch-web-access-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply exact patches
        run: |
          python scripts/patch_web_access_persistence.py
          python scripts/patch_web_access_live_reload.py
      - name: Verify persistence tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/api/auth.py src/openakita/utils/atomic_io.py tests/api/test_web_access_persistence.py
          pytest tests/api/test_web_access_persistence.py -v
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/auth.py tests/api/test_web_access_persistence.py
          git commit -m "fix: make web access persistence cross-process safe"
          git push origin HEAD:feature/hermes-multi-agent
