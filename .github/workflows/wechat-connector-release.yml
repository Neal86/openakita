name: WeChat Connector Windows release

on:
  push:
    branches: [feature/hermes-multi-agent]
    paths:
      - "src/openakita/wechat_desktop/**"
      - "src/openakita/api/routes/wechat_desktop.py"
      - "apps/setup-center/src/components/WechatDesktopPanel.tsx"
      - "scripts/build_wechat_connector.py"
      - "build/wechat_connector_*"
      - "tests/wechat_desktop/**"
      - "tests/hermes/**"
      - "deploy/hermes/**"
      - "ci-trigger/**"
      - ".github/workflows/wechat-connector-release.yml"
  pull_request:
    branches: [feature/hermes-multi-agent]
    paths:
      - "src/openakita/wechat_desktop/**"
      - "src/openakita/api/routes/wechat_desktop.py"
      - "apps/setup-center/src/components/WechatDesktopPanel.tsx"
      - "scripts/build_wechat_connector.py"
      - "build/wechat_connector_*"
      - "tests/wechat_desktop/**"
      - "tests/hermes/**"
      - "deploy/hermes/**"
      - "ci-trigger/**"
      - ".github/workflows/wechat-connector-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wechat-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      install: ${{ steps.install.outcome }}
      tests: ${{ steps.tests.outcome }}
      ruff: ${{ steps.ruff.outcome }}
      mypy: ${{ steps.mypy.outcome }}
      frontend: ${{ steps.frontend.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
      - name: WeChat Connector tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pytest -q tests/wechat_desktop
      - name: Ruff
        id: ruff
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: ruff check src/openakita/wechat_desktop src/openakita/api/routes/wechat_desktop.py tests/wechat_desktop scripts/build_wechat_connector.py build/wechat_connector_entry.py build/wechat_connector_worker_entry.py
      - name: mypy
        id: mypy
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: mypy src/openakita/wechat_desktop src/openakita/api/routes/wechat_desktop.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/setup-center/package-lock.json
      - name: Setup Center build
        id: frontend
        continue-on-error: true
        working-directory: apps/setup-center
        run: npm ci && npm run build
      - name: Enforce Connector checks
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          echo "install=$INSTALL tests=$TESTS ruff=$RUFF mypy=$MYPY frontend=$FRONTEND"
          test "$INSTALL" = success
          test "$TESTS" = success
          test "$RUFF" = success
          test "$MYPY" = success
          test "$FRONTEND" = success

  windows-release:
    needs: connector-checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install connector build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r src/openakita/wechat_desktop/connector_bundle/requirements.txt
          pip install -e .
      - name: Build Windows EXE package
        run: python scripts/build_wechat_connector.py
      - name: Validate release archive
        shell: pwsh
        run: |
          $zip = "dist/OpenAkita-WeChat-Connector-Windows-x64.zip"
          if (!(Test-Path $zip)) { throw "release ZIP missing" }
          Expand-Archive $zip -DestinationPath dist/package-check -Force
          $root = "dist/package-check/OpenAkita-WeChat-Connector-Windows-x64"
          @(
            "$root/OpenAkita-WeChat-Connector.exe",
            "$root/OpenAkita-WeChat-Connector-Worker.exe",
            "$root/README.txt"
          ) | ForEach-Object { if (!(Test-Path $_)) { throw "missing package file: $_" } }
      - name: EXE startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/OpenAkita-WeChat-Connector-Windows-x64/OpenAkita-WeChat-Connector.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "UI executable exited during startup: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-WeChat-Connector-Windows-x64
          path: dist/OpenAkita-WeChat-Connector-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  hermes-final:
    name: Hermes final checks
    needs: windows-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Hermes tests
        run: pytest -q tests/hermes
      - name: Hermes Compose validation
        run: docker compose -f deploy/hermes/docker-compose.example.yml config >/dev/null

  publish-stable-release:
    name: Publish stable Connector download
    if: github.event_name != 'pull_request'
    needs: hermes-final
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: wechat-connector-latest
      ZIP_PATH: dist/OpenAkita-WeChat-Connector-Windows-x64.zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenAkita-WeChat-Connector-Windows-x64
          path: dist
      - name: Publish stable GitHub release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"               --title "OpenAkita WeChat Connector Windows x64"               --notes "Validated Windows x64 Connector package built from commit $GITHUB_SHA."
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH"               --repo "$GITHUB_REPOSITORY"               --title "OpenAkita WeChat Connector Windows x64"               --notes "Validated Windows x64 Connector package built from commit $GITHUB_SHA."
          fi

  persist-final-result:
    name: Persist final validation result
    if: always() && github.event_name != 'pull_request'
    needs: [connector-checks, windows-release, hermes-final, publish-stable-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hermes-multi-agent
      - name: Write result JSON
        env:
          CONNECTOR_RESULT: ${{ needs.connector-checks.result }}
          CONNECTOR_INSTALL: ${{ needs.connector-checks.outputs.install }}
          CONNECTOR_TESTS: ${{ needs.connector-checks.outputs.tests }}
          CONNECTOR_RUFF: ${{ needs.connector-checks.outputs.ruff }}
          CONNECTOR_MYPY: ${{ needs.connector-checks.outputs.mypy }}
          CONNECTOR_FRONTEND: ${{ needs.connector-checks.outputs.frontend }}
          WINDOWS_RESULT: ${{ needs.windows-release.result }}
          HERMES_RESULT: ${{ needs.hermes-final.result }}
          PUBLISH_RESULT: ${{ needs.publish-stable-release.result }}
        run: |
          mkdir -p ci-results
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = {
              "workflow": "WeChat Connector Windows release",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "connector_checks": os.environ["CONNECTOR_RESULT"],
              "connector_install": os.environ["CONNECTOR_INSTALL"],
              "connector_tests": os.environ["CONNECTOR_TESTS"],
              "connector_ruff": os.environ["CONNECTOR_RUFF"],
              "connector_mypy": os.environ["CONNECTOR_MYPY"],
              "connector_frontend": os.environ["CONNECTOR_FRONTEND"],
              "windows_release": os.environ["WINDOWS_RESULT"],
              "hermes_final": os.environ["HERMES_RESULT"],
              "publish_stable_release": os.environ["PUBLISH_RESULT"],
          }
          results["success"] = all(results[key] == "success" for key in (
              "connector_checks", "windows_release", "hermes_final", "publish_stable_release"
          ))
          Path("ci-results/wechat-connector-release.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit result
        run: |
          git config user.name "openakita-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ci-results/wechat-connector-release.json
          git commit -m "ci: record WeChat Connector release result [skip ci]" || exit 0
          git push origin HEAD:feature/hermes-multi-agent
