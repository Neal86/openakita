name: WeChat Connector Windows release

on:
  push:
    branches: [feature/hermes-multi-agent]
    paths:
      - "src/openakita/wechat_desktop/**"
      - "src/openakita/api/routes/wechat_desktop.py"
      - "src/openakita/hermes/**"
      - "apps/setup-center/src/components/WechatDesktopPanel.tsx"
      - "scripts/build_wechat_connector.py"
      - "build/wechat_connector_*"
      - "tests/wechat_desktop/**"
      - "tests/hermes/**"
      - "deploy/hermes/**"
      - "ci-trigger/**"
      - ".github/workflows/wechat-connector-release.yml"
  pull_request:
    branches: [feature/hermes-multi-agent]
    paths:
      - "src/openakita/wechat_desktop/**"
      - "src/openakita/api/routes/wechat_desktop.py"
      - "src/openakita/hermes/**"
      - "apps/setup-center/src/components/WechatDesktopPanel.tsx"
      - "scripts/build_wechat_connector.py"
      - "build/wechat_connector_*"
      - "tests/wechat_desktop/**"
      - "tests/hermes/**"
      - "deploy/hermes/**"
      - "ci-trigger/**"
      - ".github/workflows/wechat-connector-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wechat-connector-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_AGENT_VERSION: "0.19.0"

jobs:
  connector-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      install: ${{ steps.install.outcome }}
      tests: ${{ steps.tests.outcome }}
      ruff: ${{ steps.ruff.outcome }}
      ruff_report: ${{ steps.ruff_report.outputs.report }}
      mypy: ${{ steps.mypy.outcome }}
      frontend: ${{ steps.frontend.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
      - name: WeChat Connector tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pytest -q tests/wechat_desktop
      - name: Ruff
        id: ruff
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          TARGETS="src/openakita/wechat_desktop src/openakita/api/routes/wechat_desktop.py tests/wechat_desktop scripts/build_wechat_connector.py build/wechat_connector_entry.py build/wechat_connector_worker_entry.py"
          ruff check --fix $TARGETS
          ruff check $TARGETS
      - name: Capture Ruff report
        id: ruff_report
        if: always()
        run: |
          TARGETS="src/openakita/wechat_desktop src/openakita/api/routes/wechat_desktop.py tests/wechat_desktop scripts/build_wechat_connector.py build/wechat_connector_entry.py build/wechat_connector_worker_entry.py"
          { ruff check $TARGETS --output-format=concise 2>&1 || true; } > /tmp/ruff-report.txt
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          tail -c 12000 /tmp/ruff-report.txt >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: mypy
        id: mypy
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: mypy src/openakita/wechat_desktop src/openakita/api/routes/wechat_desktop.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/setup-center/package-lock.json
      - name: Setup Center build
        id: frontend
        continue-on-error: true
        working-directory: apps/setup-center
        run: npm ci && npm run build
      - name: Enforce Connector checks
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          echo "install=$INSTALL tests=$TESTS ruff=$RUFF mypy=$MYPY frontend=$FRONTEND"
          test "$INSTALL" = success
          test "$TESTS" = success
          test "$RUFF" = success
          test "$MYPY" = success
          test "$FRONTEND" = success

  windows-release:
    needs: connector-checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install connector build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r src/openakita/wechat_desktop/connector_bundle/requirements.txt
          pip install -e .
      - name: Build Windows EXE package
        run: python scripts/build_wechat_connector.py
      - name: Validate release archive
        shell: pwsh
        run: |
          $zip = "dist/OpenAkita-WeChat-Connector-Windows-x64.zip"
          if (!(Test-Path $zip)) { throw "release ZIP missing" }
          Expand-Archive $zip -DestinationPath dist/package-check -Force
          $root = "dist/package-check/OpenAkita-WeChat-Connector-Windows-x64"
          @(
            "$root/OpenAkita-WeChat-Connector.exe",
            "$root/OpenAkita-WeChat-Connector-Worker.exe",
            "$root/README.txt"
          ) | ForEach-Object { if (!(Test-Path $_)) { throw "missing package file: $_" } }
      - name: EXE startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/OpenAkita-WeChat-Connector-Windows-x64/OpenAkita-WeChat-Connector.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "UI executable exited during startup: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-WeChat-Connector-Windows-x64
          path: dist/OpenAkita-WeChat-Connector-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  native-desktop-release:
    name: OpenAkita + embedded Hermes Windows installer
    needs: connector-checks
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned Hermes Agent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "hermes-agent==${HERMES_AGENT_VERSION}"
          python - <<'PY'
          import importlib.metadata
          from run_agent import AIAgent
          version = importlib.metadata.version("hermes-agent")
          assert version == "0.19.0", version
          print("Hermes Agent embedded runtime:", version, AIAgent)
          PY
      - name: Prepare production Desktop bundle
        uses: ./.github/actions/desktop-build-prepare
        with:
          target_platform: win-x64
          rust_cache_prefix: hermes-native-windows
          disable_bootstrap_cache: "false"
          python_version: "3.11"
      - name: Run Hermes and WeChat tests on Windows
        shell: bash
        run: python -m pytest tests/hermes tests/wechat_desktop -q
      - name: Copy backend and Hermes license to Tauri resources
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_DIR="apps/setup-center/src-tauri/resources"
          mkdir -p "$RESOURCE_DIR"
          rm -rf "$RESOURCE_DIR/openakita-server"
          cp -r dist/openakita-server "$RESOURCE_DIR/openakita-server"
          mkdir -p "$RESOURCE_DIR/bootstrap/licenses"
          cp THIRD_PARTY_LICENSES/HERMES_AGENT_LICENSE.txt "$RESOURCE_DIR/bootstrap/licenses/HERMES_AGENT_LICENSE.txt"
      - name: Verify embedded Hermes collection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          toc = list(Path("build").rglob("*.toc"))
          text = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in toc if p.is_file())
          if "run_agent" not in text:
              raise SystemExit("PyInstaller analysis does not contain Hermes run_agent")
          print("Verified embedded Hermes run_agent")
          PY
      - name: Verify bundled Python contract
        shell: bash
        run: |
          python build/verify_bundled_python_contract.py \
            --backend-dir apps/setup-center/src-tauri/resources/openakita-server \
            --bootstrap-manifest apps/setup-center/src-tauri/resources/bootstrap/manifest.json \
            --require-seed-packaged
      - name: Create gitignored placeholder for Rust build
        shell: bash
        run: |
          mkdir -p identity/personas
          test -f identity/personas/user_custom.md || echo "# User Custom Persona (placeholder)" > identity/personas/user_custom.md
      - name: Install frontend dependencies
        working-directory: apps/setup-center
        run: npm ci
      - name: Rust preflight
        working-directory: apps/setup-center/src-tauri
        shell: bash
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          cargo fetch --locked
          cargo check
      - name: Build unsigned Windows NSIS installer
        working-directory: apps/setup-center
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
          NO_STRIP: true
        run: npx tauri build --bundles nsis
      - name: Collect and hash installer
        id: installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/setup-center/src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          foreach ($file in $files) {
            Copy-Item $file.FullName "release-artifacts/$($file.Name)"
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            Write-Host "$($file.Name) SHA256=$hash"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-Hermes-Native-Windows-x64
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

  hermes-final:
    name: Hermes final checks
    needs: [windows-release, native-desktop-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Hermes tests
        run: pytest -q tests/hermes
      - name: Hermes Compose validation
        run: docker compose -f deploy/hermes/docker-compose.example.yml config >/dev/null

  publish-stable-release:
    name: Publish stable Connector download
    if: github.event_name != 'pull_request'
    needs: hermes-final
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: wechat-connector-latest
      ZIP_PATH: dist/OpenAkita-WeChat-Connector-Windows-x64.zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenAkita-WeChat-Connector-Windows-x64
          path: dist
      - name: Publish stable GitHub release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "OpenAkita WeChat Connector Windows x64" --notes "Validated Windows x64 Connector package built from commit $GITHUB_SHA."
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --title "OpenAkita WeChat Connector Windows x64" --notes "Validated Windows x64 Connector package built from commit $GITHUB_SHA."
          fi

  persist-final-result:
    name: Persist final validation result
    if: always() && github.event_name != 'pull_request'
    needs: [connector-checks, windows-release, native-desktop-release, hermes-final, publish-stable-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hermes-multi-agent
      - name: Write result JSON
        env:
          CONNECTOR_RESULT: ${{ needs.connector-checks.result }}
          CONNECTOR_INSTALL: ${{ needs.connector-checks.outputs.install }}
          CONNECTOR_TESTS: ${{ needs.connector-checks.outputs.tests }}
          CONNECTOR_RUFF: ${{ needs.connector-checks.outputs.ruff }}
          CONNECTOR_RUFF_REPORT: ${{ needs.connector-checks.outputs.ruff_report }}
          CONNECTOR_MYPY: ${{ needs.connector-checks.outputs.mypy }}
          CONNECTOR_FRONTEND: ${{ needs.connector-checks.outputs.frontend }}
          WINDOWS_RESULT: ${{ needs.windows-release.result }}
          NATIVE_DESKTOP_RESULT: ${{ needs.native-desktop-release.result }}
          HERMES_RESULT: ${{ needs.hermes-final.result }}
          PUBLISH_RESULT: ${{ needs.publish-stable-release.result }}
        run: |
          mkdir -p ci-results
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = {
              "workflow": "WeChat Connector Windows release",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "connector_checks": os.environ["CONNECTOR_RESULT"],
              "connector_install": os.environ["CONNECTOR_INSTALL"],
              "connector_tests": os.environ["CONNECTOR_TESTS"],
              "connector_ruff": os.environ["CONNECTOR_RUFF"],
              "connector_ruff_report": os.environ["CONNECTOR_RUFF_REPORT"],
              "connector_mypy": os.environ["CONNECTOR_MYPY"],
              "connector_frontend": os.environ["CONNECTOR_FRONTEND"],
              "windows_release": os.environ["WINDOWS_RESULT"],
              "native_desktop_release": os.environ["NATIVE_DESKTOP_RESULT"],
              "hermes_final": os.environ["HERMES_RESULT"],
              "publish_stable_release": os.environ["PUBLISH_RESULT"],
              "hermes_agent_version": "0.19.0",
              "native_runtime": True,
              "docker_required_for_windows_desktop": False,
          }
          results["success"] = all(results[key] == "success" for key in (
              "connector_checks", "windows_release", "native_desktop_release", "hermes_final", "publish_stable_release"
          ))
          Path("ci-results/wechat-connector-release.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit result
        run: |
          git config user.name "openakita-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ci-results/wechat-connector-release.json
          git commit -m "ci: record WeChat Connector release result [skip ci]" || exit 0
          git push origin HEAD:feature/hermes-multi-agent
