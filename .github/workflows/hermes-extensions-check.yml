name: Hermes extensions check

on:
  push:
    branches: [feature/hermes-extensions]
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  pull_request:
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hermes-extensions/requirements.txt pytest ruff
      - name: Compile Python
        run: python -m compileall -q hermes-extensions
      - name: Ruff
        run: ruff check hermes-extensions
      - name: Unit tests
        run: pytest -q hermes-extensions/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: node --check hermes-extensions/dashboard/dist/index.js
      - name: Validate manifests and management surfaces
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          def yaml_version(text: str) -> str:
              for line in text.splitlines():
                  if line.strip().startswith("version:"):
                      return line.split(":", 1)[1].strip().strip('"').strip("'")
              raise AssertionError("version not found")

          root = Path('hermes-extensions')
          manifest = json.loads((root / 'dashboard/manifest.json').read_text('utf-8'))
          plugin = (root / 'plugin.yaml').read_text('utf-8')
          platform_yaml = (root / 'platforms/wechat-desktop/plugin.yaml').read_text('utf-8')
          dashboard = (root / 'dashboard/dist/index.js').read_text('utf-8')
          api = (root / 'dashboard/plugin_api.py').read_text('utf-8')

          assert manifest['name'] == 'hermes-extensions'
          assert manifest['label'] == 'Management Center'
          assert manifest['has_api'] is True
          assert manifest['entry'] == 'dist/index.js'
          assert manifest['version'] == yaml_version(plugin) == yaml_version(platform_yaml) == '0.3.0'
          for tool in ('wechat_send_message', 'task_center_upcoming', 'management_overview', 'agent_create', 'project_create'):
              assert tool in plugin
          for tab in ('overview', 'agents', 'projects', 'tasks'):
              assert tab in dashboard
          for route in ('/management/overview', '/agents', '/projects'):
              assert route in api
          assert (root / 'management/service.py').is_file()
          assert (root / 'requirements.txt').is_file()
          assert 'PyYAML' in (root / 'requirements.txt').read_text('utf-8')
          assert '-r requirements.txt' in (root / 'requirements-windows.txt').read_text('utf-8')

          tree = ast.parse((root / 'platforms/wechat-desktop/adapter.py').read_text('utf-8'))
          names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert {'register', 'connect', 'disconnect', 'send'} <= names
          print('manifests, management center, dependencies, and platform surface ok')
          PY

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "hermes-extensions/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "install.ps1 syntax ok"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared dependencies
        shell: pwsh
        run: python -m pip install -r hermes-extensions/requirements.txt
      - name: Compile Windows and management modules
        shell: pwsh
        run: |
          python -m py_compile hermes-extensions/wechat/adapter.py
          python -m py_compile hermes-extensions/platforms/wechat-desktop/adapter.py
          python -m py_compile hermes-extensions/management/service.py
