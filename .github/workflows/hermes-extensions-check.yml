name: Hermes extensions check

on:
  push:
    branches: [feature/hermes-extensions]
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  pull_request:
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Compile Python
        run: python -m compileall -q hermes-extensions
      - name: Ruff
        run: ruff check hermes-extensions
      - name: Unit tests
        run: pytest -q hermes-extensions/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: node --check hermes-extensions/dashboard/dist/index.js
      - name: Validate manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('hermes-extensions/dashboard/manifest.json').read_text('utf-8'))
          assert manifest['name'] == 'hermes-extensions'
          assert manifest['api'] == 'plugin_api.py'
          plugin = Path('hermes-extensions/plugin.yaml').read_text('utf-8')
          assert 'name: hermes-extensions' in plugin
          assert 'wechat_send_message' in plugin
          assert 'task_center_upcoming' in plugin
          print('manifests ok')
          PY
