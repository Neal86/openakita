name: Hermes extensions check

on:
  push:
    branches: [feature/hermes-extensions]
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  pull_request:
    paths:
      - "hermes-extensions/**"
      - ".github/workflows/hermes-extensions-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hermes-extensions/requirements.txt pytest ruff
      - name: Compile Python
        run: python -m compileall -q hermes-extensions
      - name: Ruff
        run: ruff check hermes-extensions
      - name: Unit tests
        run: pytest -q hermes-extensions/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript source syntax
        run: node --check hermes-extensions/dashboard/src/index.js
      - name: Validate v0.4.3 release surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def yaml_version(text: str) -> str:
              for line in text.splitlines():
                  if line.strip().startswith("version:"):
                      return line.split(": 1)[1].strip().strip('"').strip("'")
              raise AssertionError("version not found")

          root = Path('hermes-extensions')
          manifest = json.loads((root / 'dashboard/manifest.json').read_text('utf-8'))
          plugin = (root / 'plugin.yaml').read_text('utf-8')
          platform_yaml = (root / 'platforms/wechat-desktop/plugin.yaml').read_text('utf-8')
          api = (root / 'dashboard/plugin_api.py').read_text('utf-8')
          compat = (root / 'compatibility.py').read_text('utf-8')
          installer = (root / 'install.ps1').read_text('utf-8')
          doctor = (root / 'doctor.ps1').read_text('utf-8')

          assert manifest['entry'] == 'dist/index.js'
          assert manifest['api'] == 'plugin_api.py'
          assert manifest['version'] == yaml_version(plugin) == yaml_version(platform_yaml) == '0.4.3'
          assert not (root / 'dashboard/compat_api.py').exists()
          assert '/capabilities' in api and 'project_supported' in api
          assert 'ttl_seconds' in compat and 'force' in compat
          assert 'rolling back previous plugin files and Hermes plugin configuration' in installer
          assert 'BackupConfig' in installer and 'ConfigExisted' in installer
          assert 'APPDATA' in installer and 'uv\\tools\\hermes-agent' in installer
          assert '[switch]$Preflight' in doctor and '[switch]$Installed' in doctor and '[switch]$Json' in doctor
          assert (root / 'doctor.ps1').is_file()
          print('v0.4.3 compatibility, transactional config rollback, and release surfaces ok')
          PY

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @("hermes-extensions/install.ps1", "hermes-extensions/doctor.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Build fake Hermes v0.16-compatible environment
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "hx-ci"
          $bin = Join-Path $root "bin"
          $appdata = Join-Path $root "AppData\Roaming"
          $hermesHome = Join-Path $root ".hermes"
          New-Item -ItemType Directory -Force -Path $bin,$appdata,$hermesHome | Out-Null
          python -m venv (Join-Path $appdata "uv\tools\hermes-agent")
          $fake = @'
          @echo off
          if "%1"=="--version" (
            echo Hermes Agent v0.16.0 test
            exit /b 0
          )
          if "%1"=="project" (
            echo hermes: error: argument command: invalid choice: 'project' 1>&2
            exit /b 2
          )
          if "%1"=="plugins" if "%2"=="enable" (
            echo enabled-%3>>"%HERMES_HOME%\config.yaml"
            if "%FAKE_HERMES_FAIL_ENABLE%"=="1" exit /b 9
            exit /b 0
          )
          if "%1"=="plugins" if "%2"=="list" (
            echo hermes-extensions enabled 0.4.3 user
            echo wechat-desktop enabled 0.4.3 user
            exit /b 0
          )
          if "%1"=="dashboard" if "%2"=="--status" (
            echo No hermes dashboard processes running.
            exit /b 0
          )
          exit /b 0
          '@
          Set-Content -LiteralPath (Join-Path $bin "hermes.cmd") -Value $fake -Encoding ASCII
          "HX_CI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$appdata" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HERMES_HOME=$hermesHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Preflight doctor
        shell: pwsh
        run: |
          & .\hermes-extensions\doctor.ps1 -Preflight -Json | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = ($report -join "`n") | ConvertFrom-Json
          if ($json.capability_project -ne $false) { throw "Expected project=false" }
          if ($json.capability_profile -ne $true) { throw "Expected profile=true" }
      - name: Real transactional install
        shell: pwsh
        run: |
          & .\hermes-extensions\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plugin = Join-Path $env:HERMES_HOME "plugins\hermes-extensions"
          $platform = Join-Path $env:HERMES_HOME "plugins\platforms\wechat-desktop"
          foreach ($path in @(
            (Join-Path $plugin "plugin.yaml"),
            (Join-Path $plugin "dashboard\manifest.json"),
            (Join-Path $plugin "dashboard\dist\index.js"),
            (Join-Path $plugin "dashboard\plugin_api.py"),
            (Join-Path $platform "plugin.yaml")
          )) { if (-not (Test-Path $path)) { throw "Missing installed file: $path" } }
          & (Join-Path $plugin "doctor.ps1") -Installed -Json | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rollback files and config on failed upgrade
        shell: pwsh
        run: |
          $plugin = Join-Path $env:HERMES_HOME "plugins\hermes-extensions"
          $config = Join-Path $env:HERMES_HOME "config.yaml"
          Set-Content -LiteralPath (Join-Path $plugin "rollback-marker.txt") -Value "old-version"
          Set-Content -LiteralPath $config -Value "baseline-config" -NoNewline
          $env:FAKE_HERMES_FAIL_ENABLE = "1"
          try { & .\hermes-extensions\install.ps1; throw "Install unexpectedly succeeded" }
          catch { Write-Host "Expected install failure: $($_.Exception.Message)" }
          finally { Remove-Item Env:FAKE_HERMES_FAIL_ENABLE -ErrorAction SilentlyContinue }
          if (-not (Test-Path (Join-Path $plugin "rollback-marker.txt"))) {
            throw "Transactional rollback did not restore previous plugin."
          }
          $restoredConfig = Get-Content -LiteralPath $config -Raw
          if ($restoredConfig -ne "baseline-config") {
            throw "Transactional rollback did not restore Hermes config. Got: $restoredConfig"
          }
