name: Hermes Native Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - ci-trigger/hermes-native-windows-release.txt
      - src/openakita/hermes/**
      - .github/workflows/hermes-native-windows-release.yml

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HERMES_AGENT_VERSION: "0.19.0"

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python for Hermes preinstall
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned Hermes Agent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "hermes-agent==${HERMES_AGENT_VERSION}"
          python - <<'PY'
          import importlib.metadata
          from run_agent import AIAgent
          import os
          version = importlib.metadata.version("hermes-agent")
          expected = os.environ["HERMES_AGENT_VERSION"]
          assert version == expected, (version, expected)
          print("Hermes Agent embedded runtime:", version, AIAgent)
          PY

      # Reuse the production Desktop preparation path. Because this runner's
      # Python 3.11 environment already contains Hermes, PyInstaller sees the
      # static run_agent import in native_runtime.py and collects Hermes into
      # the backend bundle. No Docker image is embedded or required.
      - name: Desktop build prepare
        uses: ./.github/actions/desktop-build-prepare
        with:
          target_platform: win-x64
          rust_cache_prefix: hermes-native-windows
          disable_bootstrap_cache: "false"
          python_version: "3.11"

      - name: Run Hermes/OpenAkita tests
        shell: bash
        run: |
          python -m pytest tests/hermes tests/wechat_desktop -q

      - name: Copy backend and third-party license to Tauri resources
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_DIR="apps/setup-center/src-tauri/resources"
          mkdir -p "$RESOURCE_DIR"
          rm -rf "$RESOURCE_DIR/openakita-server"
          cp -r dist/openakita-server "$RESOURCE_DIR/openakita-server"
          mkdir -p "$RESOURCE_DIR/bootstrap/licenses"
          cp THIRD_PARTY_LICENSES/HERMES_AGENT_LICENSE.txt "$RESOURCE_DIR/bootstrap/licenses/HERMES_AGENT_LICENSE.txt"

      - name: Verify embedded Hermes modules are collected
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/setup-center/src-tauri/resources/openakita-server
          python - <<'PY'
          from pathlib import Path
          toc = list(Path("build/pyinstaller_work").rglob("*.toc")) + list(Path("build").rglob("Analysis-*.toc"))
          text = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in toc if p.is_file())
          if "run_agent" not in text:
              raise SystemExit("PyInstaller analysis does not contain run_agent; refusing non-embedded build")
          print("Verified PyInstaller collected Hermes run_agent")
          PY

      - name: Verify bundled Python contract
        shell: bash
        run: |
          python build/verify_bundled_python_contract.py \
            --backend-dir apps/setup-center/src-tauri/resources/openakita-server \
            --bootstrap-manifest apps/setup-center/src-tauri/resources/bootstrap/manifest.json \
            --require-seed-packaged

      - name: Create gitignored Rust placeholder
        shell: bash
        run: |
          mkdir -p identity/personas
          if [ ! -f identity/personas/user_custom.md ]; then
            echo "# User Custom Persona (placeholder)" > identity/personas/user_custom.md
          fi

      - name: Install frontend dependencies
        working-directory: apps/setup-center
        run: npm ci

      - name: Preflight Rust dependencies
        working-directory: apps/setup-center/src-tauri
        shell: bash
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo check

      - name: Build unsigned Windows NSIS installer
        working-directory: apps/setup-center
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
          NO_STRIP: true
        run: |
          set -euo pipefail
          npx tauri build --bundles nsis --no-sign

      - name: Collect installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/setup-center/src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          foreach ($file in $files) {
            Copy-Item $file.FullName "release-artifacts/$($file.Name)"
            Get-FileHash $file.FullName -Algorithm SHA256 | Format-List
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-Hermes-Native-Windows-x64
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record successful build run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          cat > ci-results/hermes-native-windows-release.json <<JSON
          {
            "workflow": "Hermes Native Windows Release",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "hermes_agent_version": "${HERMES_AGENT_VERSION}",
            "artifact": "OpenAkita-Hermes-Native-Windows-x64",
            "native_runtime": true,
            "docker_required": false,
            "unsigned_installer": true,
            "success": true
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/hermes-native-windows-release.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record Hermes native Windows release [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
