name: OpenAkita Portable Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - ci-trigger/hermes-native-windows-release.txt
      - src/openakita/hermes/**
      - src/openakita/windows_connector/**
      - src/openakita/api/routes/windows_connector.py
      - src/openakita/api/routes/wechat_desktop.py
      - src/openakita/api/routes/execution_instances.py
      - src/openakita/api/routes/llm_gateway.py
      - apps/setup-center/src/App.tsx
      - apps/setup-center/src/types.ts
      - apps/setup-center/src/components/Sidebar.tsx
      - apps/setup-center/src/components/WindowsConnectorPanel.tsx
      - apps/setup-center/src/views/ExecutionInstancesView.tsx
      - apps/setup-center/src/views/IMConfigView.tsx
      - .github/actions/desktop-build-prepare/action.yml
      - .github/workflows/hermes-native-windows-release.yml

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HERMES_AGENT_VERSION: "0.19.0"

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for Hermes preinstall
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify committed Windows device and Agent routing integration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'openExecutionPage("windows")' apps/setup-center/src/components/Sidebar.tsx
          grep -F '<WindowsConnectorPanel apiBaseUrl={apiBaseUrl} />' apps/setup-center/src/views/ExecutionInstancesView.tsx
          if grep -F 'WechatDesktopPanel' apps/setup-center/src/views/IMConfigView.tsx; then
            echo 'Old remote Connector UI is still mounted in IM config'
            exit 1
          fi
          grep -F 'def _tool_allowed' src/openakita/hermes/capability_bridge.py

      - name: Install pinned Hermes Agent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "hermes-agent==${HERMES_AGENT_VERSION}"
          python - <<'PY'
          import importlib.metadata
          import os
          from run_agent import AIAgent
          version = importlib.metadata.version("hermes-agent")
          expected = os.environ["HERMES_AGENT_VERSION"]
          assert version == expected, (version, expected)
          print("Hermes Agent embedded runtime:", version, AIAgent)
          PY

      - name: Desktop build prepare
        uses: ./.github/actions/desktop-build-prepare
        with:
          target_platform: win-x64
          rust_cache_prefix: hermes-native-windows
          disable_bootstrap_cache: "false"
          python_version: "3.11"

      - name: Copy backend and third-party license to Tauri resources
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_DIR="apps/setup-center/src-tauri/resources"
          mkdir -p "$RESOURCE_DIR"
          rm -rf "$RESOURCE_DIR/openakita-server"
          cp -r dist/openakita-server "$RESOURCE_DIR/openakita-server"
          mkdir -p "$RESOURCE_DIR/bootstrap/licenses"
          cp THIRD_PARTY_LICENSES/HERMES_AGENT_LICENSE.txt "$RESOURCE_DIR/bootstrap/licenses/HERMES_AGENT_LICENSE.txt"

      - name: Verify embedded Hermes modules are collected
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/setup-center/src-tauri/resources/openakita-server
          python - <<'PY'
          from pathlib import Path
          toc = list(Path("build/pyinstaller_work").rglob("*.toc")) + list(Path("build").rglob("Analysis-*.toc"))
          text = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in toc if p.is_file())
          if "run_agent" not in text:
              raise SystemExit("PyInstaller analysis does not contain run_agent; refusing non-embedded build")
          print("Verified PyInstaller collected Hermes run_agent")
          PY

      - name: Verify bundled Python contract
        shell: bash
        run: |
          python build/verify_bundled_python_contract.py \
            --backend-dir apps/setup-center/src-tauri/resources/openakita-server \
            --bootstrap-manifest apps/setup-center/src-tauri/resources/bootstrap/manifest.json \
            --require-seed-packaged

      - name: Create gitignored Rust placeholder
        shell: bash
        run: |
          mkdir -p identity/personas
          if [ ! -f identity/personas/user_custom.md ]; then
            echo "# User Custom Persona (placeholder)" > identity/personas/user_custom.md
          fi

      - name: Install frontend dependencies
        working-directory: apps/setup-center
        run: npm ci

      - name: Preflight Rust dependencies
        working-directory: apps/setup-center/src-tauri
        shell: bash
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo check

      - name: Build portable OpenAkita desktop executable
        working-directory: apps/setup-center
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
          NO_STRIP: true
        run: |
          set -euo pipefail
          npx tauri build --no-bundle --no-sign

      - name: Build unzip-and-run portable package
        shell: pwsh
        run: |
          $root = "release-artifacts/OpenAkita-Portable-Windows-x64"
          $resources = Join-Path $root "resources"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $resources | Out-Null

          $desktop = "apps/setup-center/src-tauri/target/release/openakita-desktop.exe"
          if (!(Test-Path $desktop)) { throw "OpenAkita desktop executable missing: $desktop" }
          Copy-Item $desktop (Join-Path $root "OpenAkita.exe")

          $server = "apps/setup-center/src-tauri/resources/openakita-server"
          $bootstrap = "apps/setup-center/src-tauri/resources/bootstrap"
          if (!(Test-Path $server)) { throw "embedded backend resource missing" }
          if (!(Test-Path $bootstrap)) { throw "bootstrap resource missing" }
          Copy-Item $server (Join-Path $resources "openakita-server") -Recurse
          Copy-Item $bootstrap (Join-Path $resources "bootstrap") -Recurse

          @"
          OpenAkita Portable Windows x64

          1. Extract the entire ZIP to a normal writable folder.
          2. Double-click OpenAkita.exe.
          3. Do not move OpenAkita.exe out of this folder; the resources folder must stay beside it.

          This build includes the OpenAkita desktop app, embedded Hermes Agent runtime,
          embedded local Windows Connector runtime, remote Windows Connector transport,
          Windows device management UI, WeChat integration, and local app/browser discovery.
          Local apps do not require a separately installed Connector.
          Agent-owned Windows Connector capabilities take priority over Hermes-native
          computer control; Hermes native computer control remains a fallback only.
          Docker is not required for the embedded Hermes runtime.
          "@ | Set-Content -Encoding UTF8 (Join-Path $root "README.txt")

          $zip = "release-artifacts/OpenAkita-Portable-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "portable ZIP was not created" }
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Portable startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "release-artifacts/OpenAkita-Portable-Windows-x64/OpenAkita.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable OpenAkita exited during startup: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAkita-Portable-Windows-x64
          path: release-artifacts/OpenAkita-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish portable package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "openakita-windows-latest"
          $file = "release-artifacts/OpenAkita-Portable-Windows-x64.zip"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "OpenAkita Portable Windows x64" --notes "OpenAkita Windows portable build with embedded Hermes and Windows Connector runtime."
          }
          gh release upload $tag $file --repo "${{ github.repository }}" --clobber
