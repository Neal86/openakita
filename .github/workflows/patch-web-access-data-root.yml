name: One-shot durable web access data root

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - scripts/patch_web_access_data_root.py
      - .github/workflows/patch-web-access-data-root.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/patch_web_access_data_root.py
      - name: Verify durable auth root
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./openakita-plugin-sdk
          ruff check src/openakita/api/auth.py src/openakita/api/server.py src/openakita/main.py tests/api/test_web_access_data_root.py
          pytest -q tests/api/test_web_access_data_root.py tests/api/test_web_access_persistence.py tests/api/test_auth_exemption_boundaries.py
          git diff --check
      - name: Commit durable auth root
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/api/auth.py src/openakita/api/server.py src/openakita/main.py tests/api/test_web_access_data_root.py
          git commit -m "fix: persist web access config in durable data root"
          git push origin HEAD:feature/hermes-multi-agent
