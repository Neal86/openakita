name: One-shot native Hermes cancellation fix

on:
  push:
    branches:
      - feature/hermes-multi-agent
    paths:
      - .github/workflows/patch-native-hermes-cancel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hermes-multi-agent
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch product file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/openakita/hermes/native_runtime.py')
          text = path.read_text('utf-8')

          old = '''            finally:\n                stream_closed.set()\n                if not worker_task.done():\n'''
          new = '''            finally:\n                if not worker_task.done():\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('non-stream finally marker changed')

          old = '''            except asyncio.CancelledError as exc:\n                cancelled = exc\n            finally:\n                if not worker_task.done():\n                    try:\n                        await asyncio.shield(worker_task)\n'''
          new = '''            except asyncio.CancelledError as exc:\n                cancelled = exc\n            finally:\n                stream_closed.set()\n                if not worker_task.done():\n                    try:\n                        await asyncio.shield(worker_task)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('stream finally marker changed')
              text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "openakita-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openakita/hermes/native_runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: correct native Hermes stream cancellation lifecycle"
          git pull --rebase origin feature/hermes-multi-agent
          git push origin HEAD:feature/hermes-multi-agent
